kind = "web"
previewPath = "/"
title = "Quizzy"
version = "1.0.0"
id = "artifacts/mcq-quiz"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19843

[services.development]
run = "pnpm --filter @workspace/mcq-quiz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mcq-quiz", "run", "build" ]
publicDir = "artifacts/mcq-quiz/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19843"
BASE_PATH = "/"
